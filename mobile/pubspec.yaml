publish_to: "none"
version: 0.1.0+3
environment:
  sdk: ">=3.6.0 <4.0.0"   # Flutter 3.27 or newer

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
